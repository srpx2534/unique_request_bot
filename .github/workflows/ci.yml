# CI: LF disiplini, sözdizimi, tipler, testler (C26, C27, C28).
#
# İki platform da zorunludur. Windows runner servis konteyneri çalıştırmadığı
# için veritabanına giden iş Ubuntu'ya ayrılmıştır; Windows platformdan
# bağımsız testleri koşar.

name: ci

on:
  push:
  pull_request:

jobs:
  kontrol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Depoda CRLF var mı
        shell: bash
        run: |
          # Windows'ta da bash var; CRLF yakalanırsa iş kırılır.
          if git ls-files --eol | grep -q "i/crlf"; then
            echo "CRLF bulundu"; exit 1
          fi

      - name: Python sözdizimi
        run: python -m compileall -q worker tools

      - name: uule üretimi ve doğrulama
        run: |
          python tools/gen_uule.py
          python -c "import pathlib;d=pathlib.Path('db/migrations/004_uule.sql').read_text(encoding='utf-8');assert d.count('UPDATE geo')==81,'uule satır sayısı 81 değil';print('uule OK')"

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Yol disiplini
        run: python tools/lint_yol.py

      - name: Tip denetimi
        run: npm run tip

      - name: Vitest
        shell: bash
        env:
          SESSION_SECRET: ci-oturum-sirri-32-karakterden-uzun
        run: |
          # Veritabani ve Redis isteyen testler yalnizca veritabani isinde kosar.
          npx vitest run \
            --exclude "src/server/api.test.ts" \
            --exclude "src/server/panel_ayar.test.ts" \
            --exclude "src/server/panel_saglayici.test.ts" \
            --exclude "src/server/panel_sayfa.test.ts" \
            --exclude "src/server/panel_metrik.test.ts" \
            --exclude "src/server/silme.test.ts"

      - name: Pytest
        run: python -m pytest -q

  veritabani:
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: kok
          MYSQL_DATABASE: unique_request_bot
          MYSQL_USER: request
          MYSQL_PASSWORD: parola
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pparola"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: .env
        run: |
          cat > .env <<'ENV'
          MYSQL_HOST=127.0.0.1
          MYSQL_PORT=3306
          MYSQL_DATABASE=unique_request_bot
          MYSQL_USER=request
          MYSQL_PASSWORD=parola
          MYSQL_ROOT_PASSWORD=kok
          REDIS_URL=redis://127.0.0.1:6379/0
          SESSION_SECRET=ci-oturum-sirri-32-karakterden-uzun
          WORKER_TOKEN=ci-worker-token
          TEST_EPOSTA=yonetici@ornek.com
          TEST_PAROLA=PanelParola2026!
          ENV

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Şema ve seed
        run: |
          python tools/migrate.py
          python tools/seed.py

      - name: Kullanıcı
        env:
          TEST_EPOSTA: yonetici@ornek.com
          TEST_PAROLA: PanelParola2026!
        run: npm run kullanici:ekle -- "$TEST_EPOSTA" "$TEST_PAROLA"

      - name: Kurulum doğrulaması
        run: python tools/kurulum_dene.py

      - name: Vitest
        run: npm test

      - name: Pytest
        run: python -m pytest -q

