# Yerel gelistirme ortami. Windows'ta WSL2 arkasinda, sunucuda birebir ayni.
# init klasoru bagimliligi kaldirildi; sema ve seed tools/ uzerinden uygulanir.
# Tum imajlar linux/amd64 olarak sabitlenir.

services:
  mysql:
    image: mysql:8.0.36
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_turkish_ci
      - --default-time-zone=+00:00
      # Kilit tablosu buffer pool ile olceklenir; 16M varsayilani toplu
      # silmede 1206 veriyordu. Konteynere en az 1 GB RAM ayirin.
      - --innodb-buffer-pool-size=256M
      # Kilit beklemesi varsayilan 50 sn; dusuk tutulur ki toplu islem
      # sonsuza kadar kilidi tutmasin.
      - --innodb-lock-wait-timeout=20
      # Havuz tavani: panel ve worker ayni sunucudan besleniyor.
      - --max-connections=300
    ports:
      # Yalnizca yerel makineye acilir
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Panel ve worker. Sirri .env'den alir; konteyner adlari MYSQL_HOST ve
  # REDIS_URL'i ezer. DUGUM_IP servis adidir: konteyner IP'si her acilista
  # degistigi icin dugum kaydi bu adla yapilir.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    platform: linux/amd64
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      PANEL_ADRES: http://panel:8080
      DUGUM_IP: worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Worker public alt agda calisir (17.5); panel yerelde kalir.
      - "8081:8081"

  panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
    platform: linux/amd64
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      PANEL_HOST: 0.0.0.0
      NODE_ENV: production
      CEREZ_YUKLEME_KOK: /app/cerez_yukleme
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Cerez yuklemesi yazilabilir kalici birime yazilir; read_only kokfs
      # yuzunden varsayilan /app/cerez_yukleme salt okunur kaliyordu.
      - cerez_yukleme:/app/cerez_yukleme
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Partili silme uzun surebilir; sert sonlandirmada parti yarida kalmasin.
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql_data:
  cerez_yukleme:
